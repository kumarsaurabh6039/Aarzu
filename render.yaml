services:
  - type: web
    name: aarzu-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DEFAULT_USER_ID
        sync: false
      - key: CHAT_MODEL
        value: gemini-2.0-flash
      - key: EMBEDDING_MODEL
        value: models/text-embedding-004
      - key: FRONTEND_URL
        sync: false
